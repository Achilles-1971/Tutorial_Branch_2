<!DOCTYPE html>
<html lang="en">
<head>
    <title>{% block title %}Мир книг{% endblock %}</title>  <!-- Правильное размещение title -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Сайт о книгах"> <!-- Добавлено описание для SEO -->
    <!--  Рекомендуется использовать более новую версию Bootstrap  -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    {% load static %}
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">

    {% block head %}
        <header class="bg-primary text-white p-3 mb-3">  <!-- Замена изображения и шрифта на header -->
            <div class="container text-center">
                <img src="{% static 'images/logotip.jpg' %}" alt="Логотип" style="width:100px; height:100px; vertical-align: middle;">
                <h1>Мир книг</h1>
            </div>
        </header>
    {% endblock %}
</head>
<body>
    <div class="container">  <!-- Изменено на container для лучшего отступа -->
        <div class="row">
            <div class="col-md-3">  <!-- Изменено на md для лучшей адаптивности -->
                {% block sidebar %}
                    <nav class="nav flex-column">  <!-- Bootstrap 5 навигация -->
                        <a class="nav-link active" href="{% url 'index' %}">Главная страница</a>
                        <a class="nav-link" href="#">Все книги</a>
                        <a class="nav-link" href="#">Все авторы</a>
                    </nav>
                {% endblock %}
            </div>
            <div class="col-md-9">  <!-- Изменено на md для лучшей адаптивности -->
                {% block content %}{% endblock %}
            </div>
        </div>
        <footer class="bg-light text-center p-3 mt-3">  <!-- Добавлена футер -->
            <p>Copyright ООО "Люди и книги", 2024. Все права защищены, Боб Дилан знает что он размещён на этом сайте лично</p>
        </footer>
    </div>
</body>
</html>
